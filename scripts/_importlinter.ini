[importlinter]
root_packages =
    agent

[importlinter:contract:nucleus-isolation]
name = Nucleus modules must not import from presentation layer
type = forbidden
source_modules =
    agent.model_registry
    agent.model_router
    agent.multi_model_client
    agent.ollama_client
forbidden_modules =
    agent.dashboard
    agent.api_gateway
    agent.gateway
    agent.streaming
    agent.cli

[importlinter:contract:no-legacy]
name = Active path modules must not import from legacy
type = forbidden
source_modules =
    agent.auth
    agent.cli
    agent.core
    agent.dashboard
    agent.model_registry
    agent.model_router
    agent.multi_model_client
    agent.ollama_client
    agent.pipeline
    agent.rag
    agent.streaming
    agent.telegram_bot
forbidden_modules = agent.legacy
